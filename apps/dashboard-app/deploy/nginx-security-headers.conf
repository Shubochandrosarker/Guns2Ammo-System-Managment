# Shared response headers for app.guns2ammo.com.
#
# Install to /etc/nginx/snippets/g2a-security-headers.conf and `include` it in
# EVERY location block of the vhost.
#
# Why a snippet instead of one set of add_header directives at server level:
# nginx's add_header does not accumulate across levels. The moment a location
# block contains a single add_header of its own, it inherits NONE of the
# parent's. The previous vhost set six security headers at server level and
# then added Cache-Control inside `location /`, `location /assets/`, the API
# proxy and `location = /healthz` — which silently dropped HSTS, CSP,
# X-Frame-Options, Referrer-Policy and Permissions-Policy from every single
# response the site actually serves, including the HTML document. Including
# this file in each location is what makes the headers real.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy.
#
#   script-src 'self'      — the bundle is the only script; no inline <script>
#                            anywhere (the theme pre-paint runs from
#                            /theme-boot.js precisely so this can stay strict).
#   style-src  'unsafe-inline' — required: React writes inline style
#                            attributes (Card, StatCard, and every Recharts
#                            surface). Style attributes cannot be hashed.
#   img-src    https:      — the Website Content page renders WordPress media
#                            thumbnails, which are served from the WordPress
#                            origin/CDN, not from this host.
#   connect-src 'self'     — the API base is the RELATIVE /wp-json/g2a/v1
#                            proxied below, so same-origin covers it. If you
#                            ever point VITE_G2A_API_BASE at an absolute
#                            origin, that origin must be added here or every
#                            fetch is blocked.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;
