# app.guns2ammo.com — G2A Business Control Center (dashboard)
# Host: server.wpistic.cloud (VPS)
#
# Serves the built SPA from the atomic-release layout and proxies ONLY the
# g2a/v1 REST namespace to the WordPress origin, making the dashboard and
# its API same-origin (zero CORS, and the session cookie is first-party).
#
# Layout on the VPS:
#   /var/www/g2a-dashboard/releases/<release-id>/   (each deploy)
#   /var/www/g2a-dashboard/current -> releases/<release-id>
#   /var/www/g2a-dashboard/shared/                  (reserved)
#
# Install:
#   deploy/nginx-security-headers.conf -> /etc/nginx/snippets/g2a-security-headers.conf
#   this file                          -> /etc/nginx/sites-available/app.guns2ammo.com
#   nginx -t && systemctl reload nginx

# ── Login rate limiting ──────────────────────────────────────────────────
#
# Keyed through a map rather than a dedicated location block. The earlier
# version put `limit_req` in `location ~ ^/wp-json/g2a/v1/auth/`, which never
# ran: `location ^~ /wp-json/g2a/v1/` below is a prefix match with the ^~
# modifier, and nginx stops before evaluating ANY regex location once that
# matches. The login endpoint was completely unthrottled at the edge.
#
# An empty key makes limit_req skip the request, so only the credential-
# checking endpoint is counted. Deliberately NOT the whole /auth/ tree:
# GET /auth/session fires on every app boot, reload and CSRF re-hydration,
# and a shop's staff share one NAT address — throttling that at 10r/m would
# lock the building out of its own dashboard.
map $request_uri $g2a_login_key {
    default                                 "";
    ~^/wp-json/g2a/v1/auth/session/login    $binary_remote_addr;
}
limit_req_zone $g2a_login_key zone=g2a_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.guns2ammo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.guns2ammo.com;

    # TLS: Cloudflare Origin Certificate (Full-strict at the edge) or
    # Let's Encrypt. Adjust paths after installing the cert.
    ssl_certificate     /etc/ssl/g2a/app.guns2ammo.com.pem;
    ssl_certificate_key /etc/ssl/g2a/app.guns2ammo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/g2a-dashboard/current/dist;
    index index.html;

    # Request-size limit (dashboard API bodies are small)
    client_max_body_size 2m;

    # The bundle is ~500KB of JS before compression and the people using this
    # are on shop wifi. Do not assume the distro's nginx.conf turned gzip on.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Rate limit applies only where $g2a_login_key is non-empty (see the map).
    # 429 rather than nginx's default 503: the app's Login screen has a
    # specific "too many sign-in attempts" message keyed on 429, and a 503
    # would surface as a raw unexplained failure instead.
    limit_req zone=g2a_login burst=5 nodelay;
    limit_req_status 429;

    # ── Same-origin API proxy: ONLY the g2a/v1 namespace ───────────────
    # Never proxy arbitrary WordPress endpoints from this host.
    location ^~ /wp-json/g2a/v1/ {
        proxy_pass https://guns2ammo.com/wp-json/g2a/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host guns2ammo.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host app.guns2ammo.com;
        # Session cookie + CSRF headers pass through untouched.
        proxy_pass_request_headers on;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        # Authenticated API responses must never be cached.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        include /etc/nginx/snippets/g2a-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Block any other /wp-json path on this host (no open proxy).
    location /wp-json/ {
        include /etc/nginx/snippets/g2a-security-headers.conf;
        return 404;
    }

    # ── Fingerprinted static assets: cache hard ─────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/g2a-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    #
    # $uri first so /robots.txt, /favicon.svg and /theme-boot.js are served as
    # themselves. Everything else falls through to index.html for the router.
    location / {
        include /etc/nginx/snippets/g2a-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for deploy checks (static file created per release).
    location = /healthz {
        include /etc/nginx/snippets/g2a-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files /healthz.json =404;
    }
}
