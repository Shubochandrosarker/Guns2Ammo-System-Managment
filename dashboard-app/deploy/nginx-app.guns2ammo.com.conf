# app.guns2ammo.com — G2A Business Control Center (dashboard)
# Host: server.wpistic.cloud (VPS)
#
# Serves the built SPA from the atomic-release layout and proxies ONLY the
# g2a/v1 REST namespace to the WordPress origin, making the dashboard and
# its API same-origin (cookies SameSite=Lax, zero CORS).
#
# Layout on the VPS:
#   /var/www/g2a-dashboard/releases/<release-id>/   (each deploy)
#   /var/www/g2a-dashboard/current -> releases/<release-id>
#   /var/www/g2a-dashboard/shared/                  (reserved)

# Login rate limit: 10 req/min per IP on the auth endpoints (defense in
# depth in front of the plugin's own limiter).
limit_req_zone $binary_remote_addr zone=g2a_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.guns2ammo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.guns2ammo.com;

    # TLS: Cloudflare Origin Certificate (Full-strict at the edge) or
    # Let's Encrypt. Adjust paths after installing the cert.
    ssl_certificate     /etc/ssl/g2a/app.guns2ammo.com.pem;
    ssl_certificate_key /etc/ssl/g2a/app.guns2ammo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/g2a-dashboard/current/dist;
    index index.html;

    # ── Security headers (all responses) ────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request-size limit (dashboard API bodies are small)
    client_max_body_size 2m;

    # ── Same-origin API proxy: ONLY the g2a/v1 namespace ───────────────
    # Never proxy arbitrary WordPress endpoints from this host.
    location ^~ /wp-json/g2a/v1/ {
        proxy_pass https://guns2ammo.com/wp-json/g2a/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host guns2ammo.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host app.guns2ammo.com;
        # Session cookie + CSRF headers pass through untouched.
        proxy_pass_request_headers on;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        # Authenticated API responses must never be cached.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Tighter rate limit on the login/auth endpoints specifically.
    location ~ ^/wp-json/g2a/v1/auth/ {
        limit_req zone=g2a_login burst=5 nodelay;
        proxy_pass https://guns2ammo.com;
        proxy_http_version 1.1;
        proxy_set_header Host guns2ammo.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host app.guns2ammo.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Block any other /wp-json path on this host (no open proxy).
    location /wp-json/ {
        return 404;
    }

    # ── Fingerprinted static assets: cache hard ─────────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for deploy checks (static file created per release).
    location = /healthz {
        add_header Cache-Control "no-store" always;
        try_files /healthz.json =404;
    }
}
