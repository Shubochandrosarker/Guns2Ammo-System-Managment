<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d13" />
    <!--
      Private business control centre. Never index it, never follow links out
      of it, and do not let a search engine keep a cached copy of an
      authenticated screen. public/robots.txt asks crawlers not to fetch at
      all; this covers the ones that fetch anyway.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="description" content="Guns2Ammo Business Control Center — private owner and manager dashboard." />
    <title>Guns2Ammo Business Control Center</title>
    <!--
      Applies the saved theme before the first paint so dark-mode users do not
      get a white flash on every load. See public/theme-boot.js — it is a
      separate file rather than an inline script so the CSP can stay at
      script-src 'self' with no 'unsafe-inline' and no hash to keep in sync.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body class="h-full bg-ink-50 text-ink-800 antialiased">
    <div id="root" class="h-full"></div>
    <noscript>
      <!--
        Without this the app is a blank white page for anyone with JS disabled
        or blocked by an extension — indistinguishable from an outage, which
        is exactly the wrong signal to send about a dashboard.
      -->
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; color: #171a22;">
        <h1 style="font-size: 1.125rem; margin: 0 0 0.5rem;">JavaScript is required</h1>
        <p style="margin: 0; color: #3e4552;">
          The Guns2Ammo Business Control Center is an interactive dashboard and
          cannot run without JavaScript. Enable it for
          <strong>app.guns2ammo.com</strong> — or check whether a browser
          extension is blocking scripts on this site — and reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
