# Netlify build + SPA fallback for the Guns2Ammo Business Control Center.
#
# `VITE_G2A_API_BASE` MUST be set in Netlify's Environment Variables UI
# before the first production build — env.ts throws on load otherwise.
#
# CI/CD:
#   * Production branch: main
#   * Preview deploys pointed at the same WP origin — set the env var at
#     the site level so preview deploys inherit it.
#
# Custom domain:
#   * app.guns2ammo.com → this site
#   * DNS: CNAME app -> <site>.netlify.app
#   * HTTPS: Netlify's Let's Encrypt provisioning is automatic

[build]
  base    = "dashboard-app"
  publish = "dashboard-app/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
