name: PHP Composer

# Runner selection is a repository variable, not a code change:
#   RUNNER_LABEL unset  -> GitHub-hosted (ubuntu-latest), metered minutes
#   RUNNER_LABEL = g2a  -> the self-hosted runner on server.wpistic.cloud
# See docs/SELF-HOSTED-RUNNER.md.
#
# ubuntu-latest stays the default deliberately: naming a self-hosted label
# directly would make every job queue indefinitely whenever the runner is
# offline, which is harder to spot than a red check.

on:
  push:
    branches: [ "main" ]
    # Only spend Actions minutes when something PHP-shaped actually changed.
    # This repo is a private repo on a personal account, so every minute is
    # metered — a docs-only or image-only commit used to burn a full run.
    paths:
      - '**.php'
      - '**/composer.json'
      - '**/composer.lock'
      - '.github/workflows/php.yml'
      - 'scripts/lint-php.sh'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.php'
      - '**/composer.json'
      - '**/composer.lock'
      - '.github/workflows/php.yml'
      - 'scripts/lint-php.sh'
  # Lets a maintainer re-run the checks by hand after a billing or runner
  # outage, without having to push an empty commit.
  workflow_dispatch:

# Cancel a still-running check for the same branch/PR as soon as a newer
# commit shows up, instead of letting both burn Actions minutes to
# completion — a PR that gets pushed to several times in quick succession
# previously queued a full run per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax lint (all plugins)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    # No setup-php step: the ubuntu-latest image already ships a PHP CLI, and
    # `php -l` is a parser check whose result doesn't vary across 8.x. Dropping
    # it removes a third-party action from the critical path (one less thing an
    # actions-allowlist policy can block) and saves ~20-30s of metered runtime
    # per run. Add setup-php back only if this job ever needs a pinned version.
    - name: Report PHP version
      run: php -v | head -1

    # Delegates to the same script developers run locally, so CI and a
    # pre-commit hook can never drift apart in what they consider valid.
    - name: php -l every plugin/theme file
      run: ./scripts/lint-php.sh

  composer:
    name: Validate composer projects
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # This repo is a monorepo of WordPress plugins; only these
        # subprojects carry a composer.json (there is none at the root).
        project: [ plugins/g2a-business-api, plugins/g2a-pos-core, plugins/messageistic ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict --no-check-publish

    # actions/cache v3 is retired; v4 is the supported release. A retired
    # action fails the job immediately, before any of its own steps run.
    # Note `path` is resolved from the workspace root, NOT from
    # defaults.run.working-directory — that only applies to `run` steps.
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: ${{ matrix.project }}/vendor
        key: ${{ runner.os }}-php-${{ matrix.project }}-${{ hashFiles(format('{0}/composer.lock', matrix.project)) }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.project }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
