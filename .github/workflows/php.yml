name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax lint (all plugins)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: php -l every plugin/theme file
      run: |
        ERRS=0
        while IFS= read -r f; do
          out=$(php -l "$f" 2>&1) || { echo "$out"; ERRS=1; }
        done < <(find . -name '*.php' -not -path './.git/*' -not -path '*/vendor/*' -not -path '*/node_modules/*')
        exit $ERRS

  composer:
    name: Validate composer projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This repo is a monorepo of WordPress plugins; only these
        # subprojects carry a composer.json (there is none at the root).
        project: [ g2a-business-api, g2a-pos-core, messageistic, advanced-ffl-checkout ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict --no-check-publish

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: ${{ matrix.project }}/vendor
        key: ${{ runner.os }}-php-${{ matrix.project }}-${{ hashFiles(format('{0}/composer.lock', matrix.project)) }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.project }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      # g2a-pos-core (tests/Integration) and messageistic (tests/run.php) reference
      # test entry points that don't exist in this repo yet -- pre-existing gaps,
      # unrelated to this workflow change. Scope the enabled step to the two
      # projects with a verified-working test script until those are fixed.
      if: matrix.project == 'g2a-business-api' || matrix.project == 'advanced-ffl-checkout'
      run: composer run-script test
