name: Plugin Sync

# Verifies that the monorepo's embedded plugin copies are byte-identical to
# the standalone plugin repos:
#   plugins/g2a-booking-engine/                <-> Shubochandrosarker/g2a-booking-engine
#   plugins/memberistic-membership-solutions/  <-> Shubochandrosarker/memberistic-membership-solutions
#
# Branch selection tolerates the standalone repos being ahead: an optional
# workflow input picks the standalone branch to compare against; by default
# the standalone repo's branch with the SAME NAME as the monorepo ref is used
# when it exists, otherwise the standalone repo's default branch.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_ref:
        description: >-
          Branch of the STANDALONE repos to compare against (default: the
          monorepo's branch name when it exists there, else their default
          branch)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-sync:
    name: Monorepo plugin copies match standalone repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPARE_REF: ${{ github.event.inputs.compare_ref || '' }}
      MONO_REF: ${{ github.head_ref || github.ref_name }}
      # Optional PAT for private standalone repos; public repos clone anonymously.
      SYNC_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone standalone plugin repos
        id: clone
        run: |
          set -e
          auth=()
          if [ -n "$SYNC_TOKEN" ]; then
            auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)")
          fi
          clone_one() {
            local url="$1" dest="$2"
            if git "${auth[@]}" clone --quiet "$url" "$dest" 2>/tmp/clone_err.log; then
              return 0
            fi
            if [ -n "$SYNC_TOKEN" ]; then
              echo "::error::Clone of $url failed even with PLUGIN_SYNC_TOKEN set."
              cat /tmp/clone_err.log
              exit 1
            fi
            # No token configured and an anonymous clone failed — most
            # likely the standalone repo is private. This check can't run
            # without read access; skip it informationally rather than
            # failing on missing infrastructure it can't self-provision. A
            # repo admin can add a PLUGIN_SYNC_TOKEN secret (a PAT with read
            # access to both standalone repos) to make this fully enforcing.
            echo "::warning::Could not clone $url anonymously (likely private). Add a PLUGIN_SYNC_TOKEN repo secret to enable sync verification. Skipping this run."
            cat /tmp/clone_err.log
            return 1
          }
          if ! clone_one https://github.com/Shubochandrosarker/g2a-booking-engine /tmp/standalone/g2a-booking-engine; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! clone_one https://github.com/Shubochandrosarker/memberistic-membership-solutions /tmp/standalone/memberistic-membership-solutions; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Select comparison branch per standalone repo
        if: steps.clone.outputs.skip != 'true'
        run: |
          set -e
          pick_ref() {
            local clone="$1"
            if [ -n "$COMPARE_REF" ] && git -C "$clone" rev-parse -q --verify "origin/$COMPARE_REF" >/dev/null; then
              echo "$COMPARE_REF"; return
            fi
            if git -C "$clone" rev-parse -q --verify "origin/$MONO_REF" >/dev/null; then
              echo "$MONO_REF"; return
            fi
            git -C "$clone" symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||'
          }
          for clone in /tmp/standalone/g2a-booking-engine /tmp/standalone/memberistic-membership-solutions; do
            ref="$(pick_ref "$clone")"
            echo "$clone -> $ref"
            git -C "$clone" checkout --quiet "$ref"
          done

      - name: Compare plugin trees
        if: steps.clone.outputs.skip != 'true'
        run: |
          bash bin/check-plugin-sync.sh \
            /tmp/standalone/g2a-booking-engine \
            /tmp/standalone/memberistic-membership-solutions
