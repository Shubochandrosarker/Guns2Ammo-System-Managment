name: CI

# Monorepo equivalents of the standalone plugin repos' ci.yml jobs:
# PHP syntax lint across the two synced plugin directories (the full-repo
# lint lives in php.yml; the sync comparison lives in plugin-sync.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-pmpro:
    name: No Paid Memberships Pro dependency (whole repo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Scans EVERY plugin, theme, POS adapter and admin bundle in the repo —
      # not just the two synced plugin dirs. Memberistic is the single
      # membership authority; runtime PMPro symbols fail unconditionally, and
      # mentions are only tolerated in documented migration tooling and docs.
      - name: bin/check-no-pmpro.sh
        run: bash bin/check-no-pmpro.sh

  plugin-versions:
    name: Plugin version headers match runtime constants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The runtime constant is what activation writes to the options table
      # for schema bookkeeping, while the header is what WordPress and the
      # release tooling display. When they drift, the Plugins screen and the
      # database disagree and version-gated upgrade routines misfire — with no
      # error anywhere. Five plugins had drifted before this gate existed.
      - name: bin/check-plugin-versions.sh
        run: bash bin/check-plugin-versions.sh

  php-lint:
    name: PHP syntax lint ${{ matrix.plugin }} (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.3']
        plugin: [plugins/g2a-booking-engine, plugins/memberistic-membership-solutions, plugins/g2a-referrals]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: php -l every file in ${{ matrix.plugin }}
        run: find ${{ matrix.plugin }} -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l

  js-lint:
    name: JS syntax check (plugin + theme assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check every plugin asset script
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "checking $f"
            node --check "$f"
          done < <(find plugins/g2a-booking-engine/assets plugins/memberistic-membership-solutions/assets plugins/g2a-referrals/assets themes/guns2ammo/assets/js -name '*.js' -not -path '*/node_modules/*' -print0 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "no JS files found — nothing to check"
          fi

  referrals-tests:
    name: G2A Referrals unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/g2a-referrals
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # These guard rules that fail quietly and expensively: a Guest Pass
      # consumed on an already-free booking, a reward granted twice by a
      # webhook retry, offers stacking that should not stack.
      - name: PHPUnit
        run: composer run-script test
